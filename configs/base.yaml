project:
  name: mini-vla-from-scratch
  seed: 42

paths:
  data_root: data
  output_root: outputs

model:
  name: mini_vla
  action_dim: 2
  state_dim: 2
  image_size: 64
  vocab_size: 128
  max_text_len: 16
  vision_encoder:
    type: small_cnn
    output_dim: 128
  text_encoder:
    type: mock_llm
    vocab_size: 128
    hidden_dim: 128
    output_dim: 128
    freeze: true
  state_encoder:
    input_dim: 2
    hidden_dim: 64
    output_dim: 128
  fusion:
    type: concat_mlp
    input_dim: 384
    hidden_dim: 256
    output_dim: 128
  action_head:
    input_dim: 128
    hidden_dim: 128

data:
  dataset_type: toy_2d
  data_root: data/toy_2d
  batch_size: 64

train:
  epochs: 1
  lr: 0.001
  device: cpu
